name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Enable web support
      working-directory: ./CTU Projects/selecta-coe-main
      run: flutter config --enable-web
      
    - name: Get dependencies
      working-directory: ./CTU Projects/selecta-coe-main
      run: flutter pub get
      
    - name: Build web app
      working-directory: ./CTU Projects/selecta-coe-main
      run: flutter build web --base-href "/${{ github.event.repository.name }}/CTU%20Projects/selecta-coe-main/"
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./CTU Projects/selecta-coe-main/build/web
